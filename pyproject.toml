[project]
name = "presidio-anonymizer-ria"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "estnltk==1.7.4",
    "flask==3.1.0",
    "flask-cors==6.0.0",
    "flask-restx==1.3.0",
    "onnxruntime==1.20.0",
    "optimum[onnxruntime]==1.23.3",
    "presidio-analyzer==2.2.354",
    "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.7.0/xx_ent_wiki_sm-3.7.0-py3-none-any.whl",
    "presidio-anonymizer==2.2.354",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "setuptools==75.6.0",
    "spacy==3.7.5",
    "torch==2.5.1",
    "sympy==1.13.1",
    "transformers[torch]==4.46.0",
    "urllib3==2.2.3",
    "werkzeug==3.1.3",
    "zipp==3.21.0",
    "numpy==1.26.4",
    "pyright>=1.1.407",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black Formatter.
line-length = 88
indent-width = 4

# Set Python Version - 3.12
target-version = "py312"

fix = false

[tool.ruff.lint]


select = ["E4", "E7", "E9", "F", "B", "T20", "N", "ANN", "ERA", "PERF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The API test harness is a CLI reporter; writing its report to stdout is the point.
"tests/*" = ["T201"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"



[tool.pyright]
# --- Environment & discovery ---
pythonVersion = "3.12.10"          # Target Python semantics (pattern matching, typing features, stdlib types).
venvPath = "."                   # Where virtual envs live relative to repo root.
venv = ".venv"                   # The specific env name uv manages (uv sync creates .venv).

# --- What to analyze ---
include = ["*"]       # Top-level packages & tests to check.
exclude = [
  "**/.venv", "**/__pycache__", "build", "dist", ".git",
  ".ruff_cache", ".mypy_cache", "tests/", "**/tests/"
]

# --- Global strictness ---
typeCheckingMode = "standard"      # Standard typechecking mode

[dependency-groups]
dev = [
    "pre-commit==4.0.1",
]
